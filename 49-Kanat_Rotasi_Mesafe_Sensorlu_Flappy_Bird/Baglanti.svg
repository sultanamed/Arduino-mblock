<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d"><title id="t">HC-SR04 ve Arduino Uno bağlantısı</title><desc id="d">VCC: 5V, TRIG: D3, ECHO: D2, GND: GND. Pinleri kart üstündeki etiketlerden bul.</desc><rect width="720" height="320" rx="22" fill="#eaf5f0"/><g font-family="Arial, sans-serif" fill="#13383c"><text x="32" y="40" font-size="23" font-weight="bold">Dört jumper, dört bağlantı</text><text x="32" y="64" font-size="14">Uçları sıraya göre değil, modül üzerindeki etikete göre eşleştir.</text><g fill="#fff" stroke="#9abfb0" stroke-width="2"><rect x="31" y="81" width="176" height="189" rx="14"/><rect x="513" y="81" width="176" height="189" rx="14"/></g><g font-size="18" font-weight="bold" text-anchor="middle"><text x="119" y="110">HC-SR04</text><text x="601" y="110">Arduino Uno</text></g><g font-size="16" font-weight="bold"><text x="120" y="145">VCC</text><text x="120" y="181">TRIG</text><text x="120" y="217">ECHO</text><text x="120" y="253">GND</text><text x="554" y="145">5V</text><text x="554" y="181">D3</text><text x="554" y="217">D2</text><text x="554" y="253">GND</text></g><g fill="none" stroke-width="6" stroke-linecap="round"><path stroke="#bc4c38" d="M189 139H531"/><path stroke="#b27616" d="M189 175H531"/><path stroke="#147c85" d="M189 211H531"/><path stroke="#344750" d="M189 247H531"/></g><text x="32" y="296" font-size="14">USB çıkarılmışken bağla. Sensörün iki yuvarlak yüzü yukarı baksın.</text></g></svg>
